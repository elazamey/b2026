# Copy to .github/workflows/guardian.yml in the consumer repository.
# Job name must remain ai-guardian — that is the required-check identity.
name: Guardian

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  ai-guardian:
    name: ai-guardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: elazamey/b2026@main
