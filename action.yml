name: AI Architecture & Engineering Guardian
description: Deterministic architecture, dependency, security, and boundary verification for AI-generated changes. LLM does not decide SAFE TO MERGE.
author: elazamey
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Repository path to verify
    required: false
    default: "."
  contract:
    description: Path to architecture.yaml relative to the verified repository
    required: false
    default: architecture.yaml
  json:
    description: Print the decision ledger as JSON
    required: false
    default: "false"
  comment:
    description: Post or update the sticky PR decision comment using GITHUB_TOKEN
    required: false
    default: "true"
outputs:
  decision:
    description: SAFE_TO_MERGE or REJECTED
    value: ${{ steps.guardian.outputs.decision }}
  violations:
    description: Number of blocking violations
    value: ${{ steps.guardian.outputs.violations }}
  decision_id:
    description: Decision ledger id
    value: ${{ steps.guardian.outputs.decision_id }}
  contract_hash:
    description: sha256 of the architecture contract
    value: ${{ steps.guardian.outputs.contract_hash }}
  evidence_hash:
    description: sha256 of the sealed decision evidence
    value: ${{ steps.guardian.outputs.evidence_hash }}
  pull_request:
    description: Pull request number when running on a PR
    value: ${{ steps.guardian.outputs.pull_request }}
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Guardian
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build
    - name: Run AI Guardian
      id: guardian
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        JSON_FLAG=""
        if [ "${{ inputs.json }}" = "true" ]; then
          JSON_FLAG="--json"
        fi
        COMMENT_FLAG=""
        if [ "${{ inputs.comment }}" = "false" ]; then
          COMMENT_FLAG="--no-comment"
        fi
        node "${{ github.action_path }}/dist/cli.js" check "${{ inputs.path }}" \
          --contract "${{ inputs.contract }}" \
          --no-color \
          $JSON_FLAG \
          $COMMENT_FLAG
